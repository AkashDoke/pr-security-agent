name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0   # full history needed for base...head diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install semgrep

      - name: Set up Node.js (for dependency audit, only if the repo has one)
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies (for dependency audit)
        if: hashFiles('package.json') != ''
        continue-on-error: true
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts || npm install --package-lock-only --ignore-scripts
          else
            npm install --package-lock-only --ignore-scripts
          fi

      - name: Install ESLint (for React coding standards agent)
        if: hashFiles('package.json') != ''
        continue-on-error: true
        run: |
          npm install --no-save --ignore-scripts \
            eslint@^8 eslint-plugin-react eslint-plugin-react-hooks eslint-plugin-jsx-a11y \
            @typescript-eslint/parser @typescript-eslint/eslint-plugin

      - name: Run AI PR review agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python main.py
