name: PR Review (reusable)

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: true
    inputs:
      agent_ref:
        description: "Branch/tag of pr-security-agent to run (pin this in production)"
        type: string
        default: main

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout calling repo's PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout agent code
        uses: actions/checkout@v4
        with:
          repository: AkashDoke/pr-security-agent   # <-- set this to your actual org/repo
          ref: ${{ inputs.agent_ref }}
          path: .pr-agent

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install -r .pr-agent/requirements.txt
          pip install semgrep

      - name: Set up Node.js (for dependency audit, only if the repo has one)
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies (for dependency audit)
        if: hashFiles('package.json') != ''
        # --ignore-scripts: this runs on an attacker-controllable PR diff,
        # so skip postinstall/prepare scripts as defense in depth.
        # continue-on-error: a broken install shouldn't fail the whole
        # review — the dependency agent just reports nothing if this fails.
        continue-on-error: true
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts || npm install --package-lock-only --ignore-scripts
          else
            npm install --package-lock-only --ignore-scripts
          fi

      - name: Install ESLint (for React coding standards agent)
        if: hashFiles('package.json') != ''
        continue-on-error: true
        run: |
          npm install --no-save --ignore-scripts \
            eslint@^8 eslint-plugin-react eslint-plugin-react-hooks eslint-plugin-jsx-a11y \
            @typescript-eslint/parser @typescript-eslint/eslint-plugin

      - name: Run AI PR review agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PYTHONPATH: .pr-agent
        run: python .pr-agent/main.py
